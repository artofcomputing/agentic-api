name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Explicitly limit token permissions for PRs
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Caching for uv dependency management
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Linter
        run: uv run ruff check src tests

      - name: Check Formatting
        run: uv run ruff format --check src tests

      - name: Run Type Checker
        run: uv run ty check

      - name: Run Tests
        run: uv run pytest --cov --cov-report=term-missing

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agentic-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max