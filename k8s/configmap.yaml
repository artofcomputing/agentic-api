# Non-sensitive runtime configuration for the Agentic API (FINDING-001/-010).
#
# The keys mirror `.env.example` exactly (single source of truth for the
# variable schema) and are consumed by pydantic-settings as plain environment
# variables via `envFrom.configMapRef` in the Deployment.
#
# Secrets (API keys) do NOT belong here: they live in the `agentic-api-secrets`
# Secret object, which is created at deploy time and never committed to the
# repository (see README.md -> "Running on Minikube").
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-api-config
  labels:
    app.kubernetes.io/name: agentic-api
    app.kubernetes.io/component: api
data:
  # --- FASTAPI (env prefix: FASTAPI_) ---
  FASTAPI_DOCS: "True" # set "False" in production (disables /docs)
  FASTAPI_DOCS_URL: "docs"
  FASTAPI_REDOC: "True" # set "False" in production (disables /redoc)
  FASTAPI_REDOC_URL: "redoc"
  FASTAPI_HOST: "0.0.0.0" # Pods must bind all interfaces to receive probe/service traffic
  FASTAPI_PORT: "8000"
  # --- FASTAPI CORS Settings (env prefix: FASTAPI_) ---
  # These settings follow the same semantics as FastAPI, such as allowing empty lists
  # and globs. Check FastAPI docs for more information
  FASTAPI_CORS_ORIGINS: '["http://127.0.0.1:3000","http://localhost:3000"]' # tighten to explicit scheme://host[:port] origins in production
  FASTAPI_CORS_METHODS: '["GET", "POST"]'
  FASTAPI_CORS_HEADERS: '["x-api-key","content-type"]'
  FASTAPI_MAX_BODY_BYTES: "2097152" # Maximum accepted request body size in bytes
  # --- AGENT (env prefix: AGENT_) ---
  AGENT_PROVIDER: "alibaba"
  # AGENT_PROVIDER_BASE_URL is provider-specific; set it only when
  # AGENT_PROVIDER=openai_compatible, in the Secret or per-environment ConfigMap.
  AGENT_MODEL: "qwen3.7-flash"
  AGENT_TOKEN_TOTAL_LIMIT: "1000000"
  AGENT_TOOL_CALLS_LIMIT: "10" # Maximum tool invocations per agent run
  AGENT_OUTPUT_TOKENS_LIMIT: "100000" # Maximum generated tokens per agent run
  AGENT_INSTRUCTION_LIMIT: "200000" # maximum *characters* per user instruction
  AGENT_REQUEST_TIMEOUT: "60" # end-to-end deadline (seconds) per agent request
  AGENT_RETRIES: "1" # tool/output retries per run; each retry is a full LLM round-trip
  AGENT_MAX_CONCURRENT_RUNS: "3"
  # --- LOGGING (env prefix: LOG_) ---
  LOG_LEVEL: "INFO"
  LOG_JSON_FORMAT: "True"
