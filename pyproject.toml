[project]
name = "agentic-api"
version = "0.1.0"
description = "A modular, cloud-native API for AI Agents powered by FastAPI, Pydantic, and Pydantic AI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "pydantic-ai==2.30.0",
    "httpx>=0.28",
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "starlette>=1.6.0",
]

[project.scripts]
agentic = "agentic.main:start_web_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "ty>=0.0.69",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1.0",
]
[tool.coverage.run]
source = ["src/agentic"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["B008"]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "TID252",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["agentic"]
combine-as-imports = true
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "error"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]
